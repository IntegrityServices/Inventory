<style> :root { color-scheme: dark; --paper: #0B0A0B; --card: #151314; --card2: #1D191B; --ink: #F3EEEF; --muted: #A89DA0; --line: #2C2528; --accent: #A3263C; --accent-ink: #FFFFFF; --accent-t: #F29AA8; --accent-soft: #2B1519; --accent-line: #6E1F2E; --good: #52D391; --good-bg: #11301F; --warn: #F4B346; --warn-bg: #3A2A0D; --bad: #FF7A7A; --bad-bg: #421819; --cam: #050405; --font-display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --tabs-h: 64px; } * { box-sizing: border-box; } html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; } body { min-height: 100%; } h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; } button, input, select, textarea { font: inherit; color: inherit; } button { cursor: pointer; } :focus-visible { outline: 3px solid var(--accent-t); outline-offset: 2px; } .hidden { display: none !important; } .muted { color: var(--muted); } .num { font-variant-numeric: tabular-nums; } #app { max-width: 760px; margin: 0 auto; padding: 0 16px calc(var(--tabs-h) + 130px + env(safe-area-inset-bottom)); } .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 0 12px; position: sticky; top: 0; background: var(--paper); z-index: 5; } .brand { font-family: var(--font-display); font-weight: 700; font-size: 24px; display: flex; align-items: center; gap: 10px; } .sync { width: 10px; height: 10px; border-radius: 50%; background: var(--good); flex: none; } .sync.wait { background: #E39A1B; } .sync.off { background: var(--bad); } .who { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 600; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .who.empty
